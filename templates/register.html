{% extends "base.html" %}
{% block title %}Crear cuenta · Remate Martínez Online{% endblock %}
{% block content %}
<section class="container auth-wrap py-5"><div class="auth-card mx-auto">
  <span class="eyebrow text-clay">TU PRÓXIMO REMATE EMPIEZA ACÁ</span><h1 class="h2 mt-2 mb-2">Creá tu cuenta</h1><p class="text-secondary mb-4">Registrate para ofertar en los lotes que te interesan.</p>
  <form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label for="username" class="form-label">Nombre de usuario</label><input id="username" name="username" class="form-control form-control-lg" autocomplete="username" minlength="3" maxlength="80" required value="{{ request.form.get('username', '') }}"></div>
    <div class="mb-3"><label for="email" class="form-label">Correo electrónico</label><input id="email" name="email" type="email" class="form-control form-control-lg" autocomplete="email" required value="{{ request.form.get('email', '') }}"></div>
    <div class="mb-4"><label for="password" class="form-label">Contraseña <span class="text-secondary small">(mínimo 8 caracteres)</span></label><input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="new-password" minlength="8" required></div>
    <button class="btn btn-forest btn-lg w-100 rounded-pill">Crear cuenta</button>
  </form><p class="text-center text-secondary mt-4 mb-0">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Ingresá</a></p>
</div></section>
{% endblock %}
