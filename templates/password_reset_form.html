{% extends "base.html" %}
{% block title %}Nueva contraseña · Remate Martínez Online{% endblock %}
{% block content %}
<section class="container auth-wrap py-5"><div class="auth-card mx-auto">
  <span class="eyebrow text-clay">RECUPERAR ACCESO</span>
  <h1 class="h2 mt-2 mb-2">Creá una contraseña nueva</h1>
  <p class="text-secondary mb-4">El enlace es personal y válido durante una hora.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="password" class="form-label">Nueva contraseña <span class="text-secondary small">(mínimo 8 caracteres)</span></label>
      <input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="mb-4">
      <label for="password-confirmation" class="form-label">Confirmar contraseña</label>
      <input id="password-confirmation" name="password_confirmation" type="password" class="form-control form-control-lg" autocomplete="new-password" minlength="8" required>
    </div>
    <button class="btn btn-forest btn-lg w-100 rounded-pill" type="submit">Guardar contraseña</button>
  </form>
</div></section>
{% endblock %}
