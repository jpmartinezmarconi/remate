{% extends "base.html" %}
{% block title %}Área privada · Remate Martínez{% endblock %}
{% block content %}
<section class="container private-page">
  <div class="private-login-card">
    <span class="section-kicker">ACCESO DE ADMINISTRACIÓN</span>
    <h1>Área privada</h1>
    <p>Ingresá la contraseña para gestionar lotes y subastas.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="private-password">Contraseña</label>
      <input class="form-control form-control-lg" id="private-password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn btn-auction btn-lg w-100 mt-3" type="submit">Ingresar</button>
    </form>
  </div>
</section>
{% endblock %}
