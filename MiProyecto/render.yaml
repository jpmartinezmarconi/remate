services:
  - type: web
    name: miproyecto
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PASSWORD_AREA_PRIVADA
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_NOTIFICATION_CHAT_ID
        sync: false
      - key: REMINDER_TRIGGER_SECRET
        sync: false
      - key: CONTACT_EMAIL
        value: inforemateonline@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: inforemateonline@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: inforemateonline@gmail.com
      - key: PUBLIC_BASE_URL
        sync: false
