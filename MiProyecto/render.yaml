services:
  - type: web
    name: miproyecto
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app main db upgrade && gunicorn wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
